version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: lima-segura-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lima_segura
      POSTGRES_USER: lima_segura_user
      POSTGRES_PASSWORD: lima_segura_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_preload_libraries='pg_trgm'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lima_segura_user -d lima_segura"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lima-segura-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lima_segura
      SPRING_DATASOURCE_USERNAME: lima_segura_user
      SPRING_DATASOURCE_PASSWORD: lima_segura_pass
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-70b-versatile}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: