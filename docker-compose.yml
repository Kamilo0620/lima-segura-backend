version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: lima-segura-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lima_segura
      POSTGRES_USER: lima_segura_user
      POSTGRES_PASSWORD: lima_segura_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: