spring.application.name=lima-segura-backend

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lima_segura}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lima_segura_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lima_segura_pass}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Ingestion Pipeline (apagada por defecto: activar con INGESTION_ENABLED=true)
ingestion.enabled=${INGESTION_ENABLED:false}
ingestion.poll-interval=${INGESTION_POLL_INTERVAL:PT5M}
ingestion.max-attempts=${INGESTION_MAX_ATTEMPTS:5}
ingestion.min-confidence=${INGESTION_MIN_CONFIDENCE:0.75}

# LLM Configuration (OpenAI-compatible API)
llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:llama-3.1-70b-versatile}
llm.temperature=0
llm.max-tokens=4096

# Worker
worker.api-token=${WORKER_API_TOKEN:}

# Mail (optional - configure for alerts)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multipart file upload (for CSV import)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.limasegura=DEBUG
logging.level.org.springframework.scheduling=INFO
